services:
  - type: web
    name: rate-limiter
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rate-limiter-redis
          property: connectionString

  - type: keyvalue
    name: rate-limiter-redis
    plan: free
    ipAllowList: []