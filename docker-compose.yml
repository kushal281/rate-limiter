services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - .:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  demo:
    build: .
    ports:
      - "8001:8001"
    environment:
      - LIMITER_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - .:/code
    command: uvicorn demo_app.main:app --host 0.0.0.0 --port 8001 --reload